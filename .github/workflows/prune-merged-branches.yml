name: Prune merged Git branches

# A one-time cleanup runs when this workflow first lands on main.
# Subsequent cleanups can be launched manually in dry-run mode.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-merged-branches.yml
  workflow_dispatch:
    inputs:
      execute:
        description: "Delete branches proven to match already-merged PR tips"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXECUTE: ${{ github.event_name == 'push' || inputs.execute }}
    steps:
      - name: Verify and optionally prune merged PR branches
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repo = os.environ["GITHUB_REPOSITORY"]
          execute = os.environ["EXECUTE"] == "true"
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(path, method="GET"):
              with urlopen(Request(base + path, headers=headers, method=method), timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          def pages(path):
              result = []
              for page in range(1, 30):
                  separator = "&" if "?" in path else "?"
                  items = api(f"{path}{separator}per_page=100&page={page}")
                  if not isinstance(items, list):
                      raise RuntimeError(f"Expected list response for {path}")
                  result.extend(items)
                  if len(items) < 100:
                      return result
              raise RuntimeError(f"Pagination safety limit exceeded: {path}")

          repository = api("")
          branches = pages("/branches")
          pulls = pages("/pulls?state=all")
          open_heads = {
              p["head"]["ref"] for p in pulls
              if p["state"] == "open" and p["head"]["repo"]
              and p["head"]["repo"]["full_name"] == repo
          }
          closed_unmerged_heads = {
              p["head"]["ref"] for p in pulls
              if p["state"] == "closed" and not p.get("merged_at")
              and p["head"]["repo"] and p["head"]["repo"]["full_name"] == repo
          }
          merged_heads = {}
          for p in pulls:
              head = p["head"]
              if not p.get("merged_at") or not head.get("repo"):
                  continue
              if head["repo"]["full_name"] != repo or p["base"]["repo"]["full_name"] != repo:
                  continue
              merged_heads.setdefault(head["ref"], set()).add(head["sha"])

          protected_names = {"main", "master", "develop", "development", "staging", "production"}
          candidates = []
          for branch in branches:
              name, sha = branch["name"], branch["commit"]["sha"]
              if (name == repository["default_branch"] or name in protected_names
                      or branch["protected"] or name in open_heads
                      or name in closed_unmerged_heads):
                  continue
              if sha in merged_heads.get(name, set()):
                  candidates.append((name, sha))
                  continue
              # A branch without a merged PR is still redundant if its exact
              # tip is an ancestor of main (e.g. a cherry-picked fix).
              comparison = api(f"/compare/{repository['default_branch']}...{quote(name, safe='/')}")
              if comparison["ahead_by"] == 0 and comparison["status"] in ("behind", "identical"):
                  candidates.append((name, sha))

          print(f"Scanned {len(branches)} branches and {len(pulls)} PRs; "
                f"{len(candidates)} exact-tip merged-PR candidates. Execute={execute}", flush=True)
          failures = []
          for name, expected_sha in candidates:
              # Re-read before any deletion: a changed branch must survive.
              ref_name = quote(name, safe="/")
              current = api(f"/git/ref/heads/{ref_name}")
              actual_sha = current["object"]["sha"]
              if actual_sha != expected_sha:
                  print(f"SKIP changed: {name}", flush=True)
                  continue
              if execute:
                  try:
                      api(f"/git/refs/heads/{ref_name}", method="DELETE")
                      print(f"DELETED {name}", flush=True)
                  except Exception as exc:
                      print(f"ERROR {name}: {exc}", flush=True)
                      failures.append(name)
              else:
                  print(f"DRY RUN {name}", flush=True)
          if failures:
              raise RuntimeError(f"Failed to delete {len(failures)} branch(es): {failures}")
          PY
