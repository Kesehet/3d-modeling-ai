name: Temporary fresh fan autonomous resume
on:
  push:
    branches: [verify-fresh-fan-resume-20261001]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 50
    env:
      THREED_API_TOKEN: ${{ secrets.THREED_API_TOKEN }}
      THREED_HOSTNAME: ${{ vars.THREED_HOSTNAME || '3d-modeling-ai.srv1058562.hstgr.cloud' }}
      JOB_ID: b09eb15e-2951-41c2-988a-71899ff17ee3
    steps:
      - name: Resume normal autonomous pipeline
        run: |
          set -u
          BASE_URL="https://$THREED_HOSTNAME"
          mkdir -p diagnostics/json diagnostics/renders
          code=$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer $THREED_API_TOKEN" -H "Content-Type: application/json" \
            -X POST -d '{"rounds":30}' -w '%{http_code}' -o diagnostics/json/auto.json \
            "$BASE_URL/v1/jobs/$JOB_ID/auto-improve")
          echo "AUTO_HTTP=$code"; cat diagnostics/json/auto.json | jq . || true

          for attempt in $(seq 1 240); do
            curl -fsSL "$BASE_URL/dashboard/api" -o diagnostics/json/dashboard.json
            jq --arg id "$JOB_ID" '.jobs[] | select(.job_id == $id)' diagnostics/json/dashboard.json > diagnostics/json/final.json
            state=$(jq -r '.state // ""' diagnostics/json/final.json)
            ai=$(jq -r '.auto_improve.state // ""' diagnostics/json/final.json)
            stage=$(jq -r '.stage // ""' diagnostics/json/final.json)
            echo "poll=$attempt state=$state auto=$ai stage=$stage"
            if [ "$state" != "running" ] && [ "$ai" != "running" ] && [ "$ai" != "queued" ] && [ "$ai" != "starting" ]; then break; fi
            sleep 10
          done

          curl -fsSL -H "Authorization: Bearer $THREED_API_TOKEN" "$BASE_URL/v1/jobs/$JOB_ID/history" -o diagnostics/json/history.json || true
          curl -fsSL -H "Authorization: Bearer $THREED_API_TOKEN" "$BASE_URL/v1/jobs/$JOB_ID/artifacts" -o diagnostics/json/artifacts.json || true
          jq '{job_id,state,stage,modeling_strategy,auto_improve,quality_gate,feature_plan,generic_model}' diagnostics/json/final.json

          names=$(jq -r '.artifacts.renders[]?.name // empty' diagnostics/json/artifacts.json | sort -V | tail -n 54)
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            enc=$(python -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$name")
            curl -fsSL -H "Authorization: Bearer $THREED_API_TOKEN" "$BASE_URL/v1/jobs/$JOB_ID/artifacts/renders/$enc" -o "diagnostics/renders/$name" || true
          done <<< "$names"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-fan-resume-diagnostics
          path: diagnostics
          retention-days: 5
