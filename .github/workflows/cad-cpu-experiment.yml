name: CPU CAD Experiment (no GPU)
on:
  push:
    branches:
      - experiment/cpu-cad-ollama-20261011
    paths:
      - "app/cad_*.py"
      - "scripts/cad_ci_benchmark.py"
      - "tests/test_cad_experiment.py"
      - "tests/test_cad_dashboard_integration.py"
      - "app/main.py"
      - "app/dashboard.py"
      - "compose.hostinger.yaml"
      - "Dockerfile.cad"
      - "compose.cad-experiment.yaml"
      - "pyproject.toml"
      - ".github/workflows/cad-cpu-experiment.yml"
  pull_request:
    paths:
      - "app/cad_*.py"
      - "scripts/cad_ci_benchmark.py"
      - "tests/test_cad_experiment.py"
      - "Dockerfile.cad"
      - "compose.cad-experiment.yaml"
      - "pyproject.toml"
      - ".github/workflows/cad-cpu-experiment.yml"
  workflow_dispatch:
    inputs:
      live_ollama:
        description: "Use the configured real Ollama proxy (requires repository secret)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  cad-cpu-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install OpenCascade runtime and Python CAD engine
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxext6 libsm6
          python -m pip install ".[cad,dev]"
      - name: Static checks
        run: |
          ruff check app/cad_engine.py app/cad_experiment.py app/cad_service.py app/cad_jobs.py tests/test_cad_experiment.py tests/test_cad_dashboard_integration.py scripts/cad_ci_benchmark.py
          python -m compileall -q app/cad_engine.py app/cad_experiment.py app/cad_service.py
      - name: End-to-end CAD API and real BRep export tests (fake LLM)
        run: pytest -q tests/test_cad_experiment.py tests/test_cad_dashboard_integration.py
      - name: Produce independent inspectable CPU CAD outputs
        run: python scripts/cad_ci_benchmark.py --output cad-artifacts
      - name: Upload STEP/STL/GLB and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-cpu-offline-evidence
          path: cad-artifacts/
          retention-days: 14
          if-no-files-found: warn

  cad-container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Validate isolated Compose service
        env:
          THREED_API_TOKEN_B64: Y2ktdG9rZW4=
          OLLAMA_PROXY_API_KEY_B64: Y2kta2V5
        run: docker compose -f compose.cad-experiment.yaml config
      - name: Build isolated CPU-only CAD service
        run: docker build -f Dockerfile.cad -t 3d-ai-cad:ci .
      - name: Import build123d in built container (no GPU)
        run: docker run --rm --entrypoint python 3d-ai-cad:ci -c "from build123d import Box; assert Box(10,10,10).volume > 0"

  cad-real-ollama:
    # One-shot branch probe: only an explicitly tagged push consumes real proxy credits.
    if: (github.event_name == 'workflow_dispatch' && inputs.live_ollama == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[cad-live]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxext6 libsm6
          python -m pip install ".[cad]"
      - name: Live autonomous Ollama proxy generation (not mocked)
        env:
          OLLAMA_PROXY_API_KEY: ${{ secrets.OLLAMA_PROXY_API_KEY }}
          REASONING_MODEL: ${{ vars.REASONING_MODEL || 'gpt-oss:120b' }}
        run: |
          test -n "$OLLAMA_PROXY_API_KEY"
          python scripts/cad_ci_benchmark.py --live --output cad-live-artifacts
      - name: Upload real Ollama-driven models and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-cpu-live-evidence
          path: cad-live-artifacts/
          retention-days: 14
          if-no-files-found: warn
