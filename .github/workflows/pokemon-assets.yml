name: Build Pokemon Blender Assets
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blender-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Generate GLB assets
        run: |
          mkdir -p generated/assets
          blender -b --factory-startup -P tools/pokemon_game_assets.py -- "$PWD/generated/assets"
      - name: Verify assets
        run: |
          ls -lh generated/assets
          test "$(find generated/assets -name '*.glb' | wc -l)" -ge 13
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-blender-assets
          path: generated/assets/*.glb
          if-no-files-found: error
