services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: 3d-modeling-ai:local
    restart: unless-stopped
    init: true
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      THREED_API_TOKEN_B64: ${THREED_API_TOKEN_B64:?THREED_API_TOKEN_B64 must be set}
      WORKER_URL: http://worker:8090
      JOBS_ROOT: /var/lib/3d-modeling-ai/jobs
      OLLAMA_PROXY_API_KEY_B64: ${OLLAMA_PROXY_API_KEY_B64:?OLLAMA_PROXY_API_KEY_B64 must be set}
      REASONING_MODEL: ${REASONING_MODEL:-gpt-oss:120b}
      VISION_MODEL: ${VISION_MODEL:-gemma4:31b-cloud}
      VISION_MODEL_FALLBACKS: ${VISION_MODEL_FALLBACKS:-gemma4:cloud}
    ports:
      - "${THREED_HOST_PORT:-18082}:8080"
    volumes:
      - jobs-data:/var/lib/3d-modeling-ai/jobs
    depends_on:
      worker:
        condition: service_healthy
    networks:
      - worker-net
      - traefik-proxy
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.75
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.threed-modeling-ai.rule=Host(`${THREED_HOSTNAME:-3d-modeling-ai.srv1058562.hstgr.cloud}`)
      - traefik.http.routers.threed-modeling-ai.entrypoints=websecure
      - traefik.http.routers.threed-modeling-ai.tls.certresolver=letsencrypt
      - traefik.http.services.threed-modeling-ai.loadbalancer.server.port=8080

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: 3d-modeling-ai:local
    restart: unless-stopped
    init: true
    command: ["uvicorn", "app.worker:app", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      JOBS_ROOT: /var/lib/3d-modeling-ai/jobs
      BLENDER_BIN: /home/headless/blender/blender
      BLENDER_MCP_HEADLESS: "1"
      BLENDER_MCP_HEADLESS_TIMEOUT: ${BLENDER_MCP_HEADLESS_TIMEOUT:-3600}
    volumes:
      - jobs-data:/var/lib/3d-modeling-ai/jobs
    networks:
      - worker-net
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /tmp/home:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${BLENDER_WORKER_MEMORY:-4g}
    cpus: ${BLENDER_WORKER_CPUS:-1.5}
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

networks:
  worker-net:
    internal: true
  traefik-proxy:
    external: true

volumes:
  jobs-data:
