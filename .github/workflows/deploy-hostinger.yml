name: Deploy Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hostinger-3d-modeling-ai
  cancel-in-progress: true

env:
  VPS_ID: "1058562"
  BOOTSTRAP_PROJECT: 3d-modeling-ai-bootstrap

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deployment secrets
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          THREED_API_TOKEN: ${{ secrets.THREED_API_TOKEN }}
          OLLAMA_PROXY_API_KEY: ${{ secrets.OLLAMA_PROXY_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_API_KEY"
          test -n "$THREED_API_TOKEN"
          test -n "$OLLAMA_PROXY_API_KEY"

      - name: Encode app secrets
        id: encoded
        env:
          THREED_API_TOKEN: ${{ secrets.THREED_API_TOKEN }}
          OLLAMA_PROXY_API_KEY: ${{ secrets.OLLAMA_PROXY_API_KEY }}
        run: |
          set -euo pipefail
          THREED_B64=$(printf '%s' "$THREED_API_TOKEN" | base64 -w0)
          OLLAMA_B64=$(printf '%s' "$OLLAMA_PROXY_API_KEY" | base64 -w0)
          echo "::add-mask::$THREED_B64"
          echo "::add-mask::$OLLAMA_B64"
          echo "threed=$THREED_B64" >> "$GITHUB_OUTPUT"
          echo "ollama=$OLLAMA_B64" >> "$GITHUB_OUTPUT"

      - name: Prepare bootstrap compose
        env:
          THREED_API_TOKEN_B64: ${{ steps.encoded.outputs.threed }}
          OLLAMA_PROXY_API_KEY_B64: ${{ steps.encoded.outputs.ollama }}
          THREED_HOSTNAME: ${{ vars.THREED_HOSTNAME || '3d-modeling-ai.srv1058562.hstgr.cloud' }}
        run: |
          cat > "$RUNNER_TEMP/bootstrap.yml" <<'YAML'
          services:
            bootstrap:
              image: docker:27-cli
              restart: "no"
              environment:
                GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:?required}
                GITHUB_SHA: ${GITHUB_SHA:?required}
                THREED_API_TOKEN_B64: ${THREED_API_TOKEN_B64:?required}
                OLLAMA_PROXY_API_KEY_B64: ${OLLAMA_PROXY_API_KEY_B64:?required}
                THREED_HOSTNAME: ${THREED_HOSTNAME:-3d-modeling-ai.srv1058562.hstgr.cloud}
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock
                - /opt/3d-modeling-ai:/workspace
              command:
                - /bin/sh
                - -ec
                - |
                  apk add --no-cache curl tar >/dev/null
                  curl --fail --location --silent --show-error \
                    "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/vps_bootstrap.sh" \
                    --output /tmp/vps_bootstrap.sh
                  chmod +x /tmp/vps_bootstrap.sh
                  exec /tmp/vps_bootstrap.sh
          YAML

          runtime_env=$(printf '%s\n' \
            "GITHUB_REPOSITORY=$GITHUB_REPOSITORY" \
            "GITHUB_SHA=$GITHUB_SHA" \
            "THREED_API_TOKEN_B64=$THREED_API_TOKEN_B64" \
            "OLLAMA_PROXY_API_KEY_B64=$OLLAMA_PROXY_API_KEY_B64" \
            "THREED_HOSTNAME=$THREED_HOSTNAME")
          jq -n \
            --arg project_name "$BOOTSTRAP_PROJECT" \
            --rawfile content "$RUNNER_TEMP/bootstrap.yml" \
            --arg environment "$runtime_env" \
            '{project_name:$project_name,content:$content,environment:$environment}' \
            > "$RUNNER_TEMP/bootstrap-payload.json"

      - name: Launch bootstrap through Hostinger
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
        run: |
          set -euo pipefail
          base="https://developers.hostinger.com/api/vps/v1/virtual-machines/$VPS_ID/docker"
          curl --silent --show-error --request DELETE \
            --header "Authorization: Bearer $HOSTINGER_API_KEY" \
            "$base/$BOOTSTRAP_PROJECT/down" >/dev/null 2>&1 || true
          sleep 3
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $HOSTINGER_API_KEY" \
            --header 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/bootstrap-payload.json" \
            "$base" >/dev/null
          echo "Bootstrap submitted to VPS."

      - name: Wait for VPS build and startup
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
        run: |
          set -euo pipefail
          base="https://developers.hostinger.com/api/vps/v1/virtual-machines/$VPS_ID/docker"
          for attempt in $(seq 1 180); do
            containers=$(curl --silent --show-error --header "Authorization: Bearer $HOSTINGER_API_KEY" \
              "$base/$BOOTSTRAP_PROJECT/containers" 2>/dev/null || echo '[]')
            logs=$(curl --silent --show-error --header "Authorization: Bearer $HOSTINGER_API_KEY" \
              "$base/$BOOTSTRAP_PROJECT/logs" 2>/dev/null || echo '[]')
            if echo "$logs" | jq -e '[.[]?.entries[]?.line // ""] | any(. == "THREED_BOOTSTRAP_OK")' >/dev/null 2>&1; then
              echo "VPS build and startup completed."
              exit 0
            fi
            state=$(echo "$containers" | jq -r 'if type == "array" and length > 0 then .[0].state // "unknown" else "pending" end' 2>/dev/null || echo pending)
            echo "Bootstrap attempt $attempt/180: state=$state"
            if [ "$state" = exited ] || [ "$state" = dead ]; then
              echo "Bootstrap failed. Recent VPS output:" >&2
              echo "$logs" | jq -r '.[]?.entries[-240:][]? | "\(.timestamp // "") \(.line // "")"' || true
              exit 1
            fi
            sleep 5
          done
          echo "Bootstrap timed out." >&2
          logs=$(curl --silent --show-error --header "Authorization: Bearer $HOSTINGER_API_KEY" \
            "$base/$BOOTSTRAP_PROJECT/logs" 2>/dev/null || echo '[]')
          echo "$logs" | jq -r '.[]?.entries[-240:][]? | "\(.timestamp // "") \(.line // "")"' || true
          exit 1

      - name: Verify public API and Blender MCP
        env:
          THREED_API_TOKEN: ${{ secrets.THREED_API_TOKEN }}
          THREED_HOSTNAME: ${{ vars.THREED_HOSTNAME || '3d-modeling-ai.srv1058562.hstgr.cloud' }}
        run: |
          set -euo pipefail
          BASE_URL="https://$THREED_HOSTNAME"
          for attempt in $(seq 1 48); do
            if HEALTH=$(curl --fail --silent --show-error --max-time 10 "$BASE_URL/health"); then
              echo "$HEALTH" | jq .
              if echo "$HEALTH" | jq -e '.ok == true' >/dev/null; then
                break
              fi
            fi
            if [ "$attempt" -eq 48 ]; then
              echo "Public API did not become healthy." >&2
              exit 1
            fi
            sleep 10
          done

          JOB_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $THREED_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"prompt":"Deployment MCP smoke test cube","intended_use":"rendering"}' \
            "$BASE_URL/v1/jobs")
          JOB_ID=$(echo "$JOB_JSON" | jq -r '.job_id')
          test -n "$JOB_ID"
          test "$JOB_ID" != "null"

          SMOKE=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $THREED_API_TOKEN" \
            -X POST "$BASE_URL/v1/jobs/$JOB_ID/smoke-test")
          echo "$SMOKE" | jq .
          echo "$SMOKE" | jq -e '.status.stage == "mcp_smoke_test_complete"' >/dev/null

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $THREED_API_TOKEN" \
            "$BASE_URL/v1/jobs/$JOB_ID/artifacts/renders/smoke-test.png" \
            -o /tmp/smoke-test.png
          test "$(xxd -p -l 8 /tmp/smoke-test.png)" = "89504e470d0a1a0a"
          echo "Verified API -> worker -> MCP -> Blender -> PNG."

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $THREED_API_TOKEN" \
            -X DELETE "$BASE_URL/v1/jobs/$JOB_ID" >/dev/null
          echo "Removed disposable infrastructure smoke job."

      - name: Run live Pikachu regression
        if: ${{ contains(github.event.head_commit.message || '', '[live-pikachu]') }}
        env:
          THREED_HOSTNAME: ${{ vars.THREED_HOSTNAME || '3d-modeling-ai.srv1058562.hstgr.cloud' }}
        run: |
          set -euo pipefail
          BASE_URL="https://$THREED_HOSTNAME"
          JOB_JSON=$(curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d '{"prompt":"Create a stylized Pikachu test model","intended_use":"rendering"}' \
            "$BASE_URL/dashboard/jobs")
          JOB_ID=$(echo "$JOB_JSON" | jq -r '.job_id')
          test -n "$JOB_ID"
          test "$JOB_ID" != "null"

          HTTP_CODE=$(curl --silent --show-error --max-time 600 \
            -o /tmp/pikachu-result.json -w '%{http_code}' \
            -X POST "$BASE_URL/dashboard/jobs/$JOB_ID/pikachu")
          cat /tmp/pikachu-result.json | jq . || cat /tmp/pikachu-result.json
          test "$HTTP_CODE" -ge 200
          test "$HTTP_CODE" -lt 300

          for name in \
            pikachu-front.png \
            pikachu-front-left.png \
            pikachu-left.png \
            pikachu-back-left.png \
            pikachu-back.png \
            pikachu-back-right.png \
            pikachu-right.png \
            pikachu-front-right.png \
            pikachu-top.png
          do
            curl --fail --silent --show-error --max-time 30 \
              "$BASE_URL/dashboard/renders/$JOB_ID/$name" \
              -o "/tmp/$name"
            test "$(xxd -p -l 8 "/tmp/$name")" = "89504e470d0a1a0a"
          done

          echo "Live Pikachu regression passed for job $JOB_ID."

      - name: Run live generic modeling regression
        if: ${{ contains(github.event.head_commit.message || '', '[live-generic]') }}
        env:
          THREED_HOSTNAME: ${{ vars.THREED_HOSTNAME || '3d-modeling-ai.srv1058562.hstgr.cloud' }}
        run: |
          set -euo pipefail
          BASE_URL="https://$THREED_HOSTNAME"
          JOB_JSON=$(curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d '{"prompt":"Create a complex retro-futuristic quadruped exploration robot: armored rectangular torso, four articulated two-segment legs with round joints and feet, offset camera head, twin side sensor pods, top antenna mast, rear battery pack, and one asymmetric tool arm. Use a white, dark gray and safety-orange color scheme.","intended_use":"rendering"}' \
            "$BASE_URL/dashboard/jobs")
          JOB_ID=$(echo "$JOB_JSON" | jq -r '.job_id')
          test -n "$JOB_ID"
          test "$JOB_ID" != "null"

          HTTP_CODE=$(curl --silent --show-error --max-time 900 \
            -o /tmp/generic-result.json -w '%{http_code}' \
            -H "Content-Type: application/json" \
            -d '{"auto_research":true}' \
            -X POST "$BASE_URL/dashboard/jobs/$JOB_ID/generate")
          cat /tmp/generic-result.json | jq . || cat /tmp/generic-result.json
          test "$HTTP_CODE" -ge 200
          test "$HTTP_CODE" -lt 300
          jq -e '.status.stage == "generic_rendered_v1"' /tmp/generic-result.json >/dev/null
          jq -e '.renders | length == 9' /tmp/generic-result.json >/dev/null
          jq -e '.spec.objects | length >= 8' /tmp/generic-result.json >/dev/null

          curl --fail --silent --show-error --max-time 30 \
            "$BASE_URL/dashboard/renders/$JOB_ID/model-v1-front.png" \
            -o /tmp/model-v1-front.png
          test "$(xxd -p -l 8 /tmp/model-v1-front.png)" = "89504e470d0a1a0a"

          for path in \
            "scene/model-v1.blend" \
            "exports/model-v1.glb" \
            "exports/model-v1.obj" \
            "exports/model-v1.stl" \
            "exports/model-v1-qa.json"
          do
            category=${path%%/*}
            filename=${path#*/}
            curl --fail --silent --show-error --max-time 30 \
              "$BASE_URL/dashboard/artifacts/$JOB_ID/$category/$filename" \
              -o "/tmp/$filename"
            test -s "/tmp/$filename"
          done

          IMPROVE_CODE=$(curl --silent --show-error --max-time 900 \
            -o /tmp/generic-improve.json -w '%{http_code}' \
            -H "Content-Type: application/json" \
            -d '{"iterations":1}' \
            -X POST "$BASE_URL/dashboard/jobs/$JOB_ID/improve")
          cat /tmp/generic-improve.json | jq . || cat /tmp/generic-improve.json
          test "$IMPROVE_CODE" -ge 200
          test "$IMPROVE_CODE" -lt 300
          jq -e '(.status.stage == "generic_refinement_complete") or (.status.stage == "generic_refinement_preserved_previous")' /tmp/generic-improve.json >/dev/null
          jq -e '((.iterations | length) >= 1) or (.rejected != null)' /tmp/generic-improve.json >/dev/null

          if jq -e '((.iterations | length) >= 1) and (.iterations[-1].accepted == true)' /tmp/generic-improve.json >/dev/null; then
            curl --fail --silent --show-error --max-time 30 \
              "$BASE_URL/dashboard/renders/$JOB_ID/model-v2-front.png" \
              -o /tmp/model-v2-front.png
            test "$(xxd -p -l 8 /tmp/model-v2-front.png)" = "89504e470d0a1a0a"
            curl --fail --silent --show-error --max-time 30 \
              "$BASE_URL/dashboard/artifacts/$JOB_ID/scene/model-v2.blend" \
              -o /tmp/model-v2.blend
            test -s /tmp/model-v2.blend
          else
            jq -e '.status.stage == "generic_refinement_preserved_previous"' /tmp/generic-improve.json >/dev/null
            jq -e '.rejected.reasons | length >= 1' /tmp/generic-improve.json >/dev/null
            echo "Refinement candidate was safely rejected; keeping model-v1."
          fi

          DASHBOARD=$(curl --fail --silent --show-error "$BASE_URL/dashboard/api")
          echo "$DASHBOARD" | jq -e --arg id "$JOB_ID" '.jobs[] | select(.job_id == $id) | .renders | length >= 9' >/dev/null
          echo "Live generic prompt -> research -> SceneSpec -> Blender -> files -> improve regression passed for job $JOB_ID."

      - name: Run live P0 quality benchmark suite
        if: ${{ contains(github.event.head_commit.message || '', '[live-quality]') }}
        env:
          THREED_HOSTNAME: ${{ vars.THREED_HOSTNAME || '3d-modeling-ai.srv1058562.hstgr.cloud' }}
        run: |
          set -euo pipefail
          BASE_URL="https://$THREED_HOSTNAME"

          run_benchmark() {
            key="$1"
            prompt="$2"
            echo "=== Quality benchmark: $key ==="

            payload=$(jq -nc --arg prompt "$prompt" '{prompt:$prompt,intended_use:"rendering"}')
            if ! JOB_JSON=$(curl --fail --silent --show-error \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$BASE_URL/dashboard/jobs"); then
              echo "FAIL: $key could not create a job"
              return 1
            fi
            JOB_ID=$(echo "$JOB_JSON" | jq -r '.job_id')
            if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
              echo "FAIL: $key returned no job id"
              return 1
            fi
            echo "Benchmark job: $JOB_ID"

            HTTP_CODE=$(curl --silent --show-error --max-time 900 \
              -o "/tmp/quality-$key-generate.json" -w '%{http_code}' \
              -H "Content-Type: application/json" \
              -d '{"auto_research":false}' \
              -X POST "$BASE_URL/dashboard/jobs/$JOB_ID/generate" || true)
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ] \
              || ! jq -e '.status.stage == "generic_initial_recognizable"' "/tmp/quality-$key-generate.json" >/dev/null \
              || ! jq -e '.status.quality_gate.recognizable == true' "/tmp/quality-$key-generate.json" >/dev/null \
              || ! jq -e '.renders | length == 9' "/tmp/quality-$key-generate.json" >/dev/null; then
              echo "FAIL: $key generation failed"
              cat "/tmp/quality-$key-generate.json" | jq . || cat "/tmp/quality-$key-generate.json"
              return 1
            fi

            QUALITY_CODE=$(curl --silent --show-error --max-time 600 \
              -o "/tmp/quality-$key-report.json" -w '%{http_code}' \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"$key\"}" \
              -X POST "$BASE_URL/dashboard/jobs/$JOB_ID/quality-benchmark" || true)
            cat "/tmp/quality-$key-report.json" | jq . || cat "/tmp/quality-$key-report.json"
            if [ "$QUALITY_CODE" -lt 200 ] || [ "$QUALITY_CODE" -ge 300 ] \
              || ! jq -e '.structural.passed == true' "/tmp/quality-$key-report.json" >/dev/null \
              || ! jq -e '.visual.pass_benchmark == true' "/tmp/quality-$key-report.json" >/dev/null \
              || ! jq -e '.passed == true' "/tmp/quality-$key-report.json" >/dev/null; then
              echo "FAIL: $key quality gate failed; preserving job $JOB_ID for inspection"
              return 1
            fi

            curl --fail --silent --show-error \
              -X DELETE "$BASE_URL/dashboard/jobs/$JOB_ID" >/dev/null
            echo "PASS: $key"
            return 0
          }

          FAILURES=""
          run_benchmark "pikachu" "Create a stylized Pikachu test model with a large head, yellow rounded body, two long pointed ears with black tips, two black eyes, two red cheek circles, two short arms, two feet, and a large lightning-bolt tail." || FAILURES="$FAILURES pikachu"
          run_benchmark "desk-lamp" "Create a compact retro desk lamp with a round weighted base, a connected vertical stem, a clearly angled neck with a visible pivot joint, and a dome-shaped shade physically attached to the neck. The lamp must read as one connected articulated object." || FAILURES="$FAILURES desk-lamp"
          run_benchmark "sneaker" "Create a stylized low-top sneaker with a layered sole, rounded toe box, shaped upper, heel counter, tongue, foot opening, and several visible laces crossing the tongue." || FAILURES="$FAILURES sneaker"
          run_benchmark "office-chair" "Create a modern ergonomic office chair with a padded seat, upright backrest, two armrests, central gas-lift column, five-spoke wheeled base, and five caster wheels." || FAILURES="$FAILURES office-chair"
          run_benchmark "quadruped-robot" "Create a complex retro-futuristic quadruped exploration robot with an armored rectangular torso, four articulated two-segment legs with round joints and feet, an offset camera head, twin side sensor pods, top antenna mast, rear battery pack, and one asymmetric tool arm. Use a white, dark gray and safety-orange color scheme." || FAILURES="$FAILURES quadruped-robot"

          if [ -n "$FAILURES" ]; then
            echo "P0 quality failures:$FAILURES" >&2
            exit 1
          fi
          echo "All P0 structural + visual quality benchmarks passed."

      - name: Roll back failed deployment
        if: ${{ failure() && github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          THREED_API_TOKEN_B64: ${{ steps.encoded.outputs.threed }}
          OLLAMA_PROXY_API_KEY_B64: ${{ steps.encoded.outputs.ollama }}
          THREED_HOSTNAME: ${{ vars.THREED_HOSTNAME || '3d-modeling-ai.srv1058562.hstgr.cloud' }}
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/bootstrap.yml" ]; then
            echo "Rollback bootstrap definition is unavailable; nothing was deployed yet."
            exit 0
          fi
          test -n "$HOSTINGER_API_KEY"
          test -n "$THREED_API_TOKEN_B64"
          test -n "$OLLAMA_PROXY_API_KEY_B64"
          test -n "$PREVIOUS_SHA"

          echo "Deployment validation failed. Rolling production back to $PREVIOUS_SHA."
          runtime_env=$(printf '%s\n' \
            "GITHUB_REPOSITORY=$GITHUB_REPOSITORY" \
            "GITHUB_SHA=$PREVIOUS_SHA" \
            "THREED_API_TOKEN_B64=$THREED_API_TOKEN_B64" \
            "OLLAMA_PROXY_API_KEY_B64=$OLLAMA_PROXY_API_KEY_B64" \
            "THREED_HOSTNAME=$THREED_HOSTNAME")
          jq -n \
            --arg project_name "$BOOTSTRAP_PROJECT" \
            --rawfile content "$RUNNER_TEMP/bootstrap.yml" \
            --arg environment "$runtime_env" \
            '{project_name:$project_name,content:$content,environment:$environment}' \
            > "$RUNNER_TEMP/rollback-payload.json"

          base="https://developers.hostinger.com/api/vps/v1/virtual-machines/$VPS_ID/docker"
          curl --silent --show-error --request DELETE \
            --header "Authorization: Bearer $HOSTINGER_API_KEY" \
            "$base/$BOOTSTRAP_PROJECT/down" >/dev/null 2>&1 || true
          sleep 3
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $HOSTINGER_API_KEY" \
            --header 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/rollback-payload.json" \
            "$base" >/dev/null

          for attempt in $(seq 1 180); do
            containers=$(curl --silent --show-error --header "Authorization: Bearer $HOSTINGER_API_KEY" \
              "$base/$BOOTSTRAP_PROJECT/containers" 2>/dev/null || echo '[]')
            logs=$(curl --silent --show-error --header "Authorization: Bearer $HOSTINGER_API_KEY" \
              "$base/$BOOTSTRAP_PROJECT/logs" 2>/dev/null || echo '[]')
            if echo "$logs" | jq -e '[.[]?.entries[]?.line // ""] | any(. == "THREED_BOOTSTRAP_OK")' >/dev/null 2>&1; then
              echo "Rollback completed successfully to $PREVIOUS_SHA."
              exit 0
            fi
            state=$(echo "$containers" | jq -r 'if type == "array" and length > 0 then .[0].state // "unknown" else "pending" end' 2>/dev/null || echo pending)
            echo "Rollback attempt $attempt/180: state=$state"
            if [ "$state" = exited ] || [ "$state" = dead ]; then
              echo "Rollback bootstrap failed." >&2
              echo "$logs" | jq -r '.[]?.entries[-240:][]? | "\(.timestamp // "") \(.line // "")"' || true
              exit 1
            fi
            sleep 5
          done

          echo "Rollback timed out." >&2
          exit 1

      - name: Remove disposable bootstrap
        if: always()
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
        run: |
          set +e
          curl --silent --show-error --request DELETE \
            --header "Authorization: Bearer $HOSTINGER_API_KEY" \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines/$VPS_ID/docker/$BOOTSTRAP_PROJECT/down" >/dev/null || true
          rm -f "$RUNNER_TEMP/bootstrap.yml" "$RUNNER_TEMP/bootstrap-payload.json" 2>/dev/null || true
