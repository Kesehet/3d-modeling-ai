name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Tests
        run: pytest -q
      - name: Compile
        run: python -m compileall -q app

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate local compose
        run: docker compose -f compose.yaml config
      - name: Validate Hostinger compose
        env:
          THREED_API_TOKEN_B64: Y2ktcGxhY2Vob2xkZXI=
          OLLAMA_PROXY_API_KEY_B64: Y2ktcGxhY2Vob2xkZXI=
          THREED_HOSTNAME: 3d-modeling-ai.example.invalid
        run: docker compose -f compose.hostinger.yaml config

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build production Blender image
        run: docker build --progress=plain -t 3d-modeling-ai:ci .
      - name: Exercise Blender geometry, camera framing and model exports
        run: >-
          docker run --rm --entrypoint /opt/venv/bin/python
          -v "$PWD/tests:/tests:ro" 3d-modeling-ai:ci /tests/blender_integration.py
