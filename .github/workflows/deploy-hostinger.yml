name: Deploy Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hostinger-3d-modeling-ai
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check deployment secrets
        id: secrets
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          THREED_API_TOKEN: ${{ secrets.THREED_API_TOKEN }}
          OLLAMA_PROXY_API_KEY: ${{ secrets.OLLAMA_PROXY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$HOSTINGER_API_KEY" ] || [ -z "$THREED_API_TOKEN" ] || [ -z "$OLLAMA_PROXY_API_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deployment skipped: HOSTINGER_API_KEY, THREED_API_TOKEN, and OLLAMA_PROXY_API_KEY are required."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Encode app secrets for Hostinger
        if: steps.secrets.outputs.ready == 'true'
        id: encoded
        env:
          THREED_API_TOKEN: ${{ secrets.THREED_API_TOKEN }}
          OLLAMA_PROXY_API_KEY: ${{ secrets.OLLAMA_PROXY_API_KEY }}
        run: |
          set -euo pipefail
          THREED_B64=$(printf '%s' "$THREED_API_TOKEN" | base64 -w0)
          OLLAMA_B64=$(printf '%s' "$OLLAMA_PROXY_API_KEY" | base64 -w0)
          echo "::add-mask::$THREED_B64"
          echo "::add-mask::$OLLAMA_B64"
          echo "threed=$THREED_B64" >> "$GITHUB_OUTPUT"
          echo "ollama=$OLLAMA_B64" >> "$GITHUB_OUTPUT"

      - name: Validate Hostinger compose
        if: steps.secrets.outputs.ready == 'true'
        env:
          THREED_API_TOKEN_B64: ${{ steps.encoded.outputs.threed }}
          OLLAMA_PROXY_API_KEY_B64: ${{ steps.encoded.outputs.ollama }}
          THREED_HOSTNAME: ${{ vars.THREED_HOSTNAME || '3d-modeling-ai.srv1058562.hstgr.cloud' }}
        run: docker compose -f compose.hostinger.yaml config

      - name: Capture current container generation
        if: steps.secrets.outputs.ready == 'true'
        id: previous
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
        run: |
          set -euo pipefail
          URL="https://developers.hostinger.com/api/vps/v1/virtual-machines/1058562/docker/3d-modeling-ai/containers"
          RESPONSE=$(curl --fail --silent --show-error -H "Authorization: Bearer $HOSTINGER_API_KEY" "$URL" || echo '[]')
          IDS=$(echo "$RESPONSE" | jq -r 'map(.id) | join(",")')
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

      - name: Deploy isolated Hostinger Docker project
        if: steps.secrets.outputs.ready == 'true'
        uses: hostinger/deploy-on-vps@b0868cec74bfa63af6bfa7bdb0dfee2f9bef13ea
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: "1058562"
          project-name: 3d-modeling-ai
          docker-compose-path: compose.hostinger.yaml
          environment-variables: |
            THREED_API_TOKEN_B64=${{ steps.encoded.outputs.threed }}
            THREED_HOST_PORT=18082
            THREED_HOSTNAME=${{ vars.THREED_HOSTNAME || '3d-modeling-ai.srv1058562.hstgr.cloud' }}
            OLLAMA_PROXY_API_KEY_B64=${{ steps.encoded.outputs.ollama }}
            REASONING_MODEL=${{ vars.REASONING_MODEL || 'gpt-oss:120b' }}
            VISION_MODEL=${{ vars.VISION_MODEL || 'qwen3-vl:235b-cloud' }}
            BLENDER_MCP_HEADLESS_TIMEOUT=3600
            BLENDER_WORKER_MEMORY=4g
            BLENDER_WORKER_CPUS=3.0

      - name: Wait for new containers
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          PREVIOUS_IDS: ${{ steps.previous.outputs.ids }}
        run: |
          set -euo pipefail
          URL="https://developers.hostinger.com/api/vps/v1/virtual-machines/1058562/docker/3d-modeling-ai/containers"
          sleep 15

          for attempt in $(seq 1 60); do
            RESPONSE=$(curl --fail --silent --show-error -H "Authorization: Bearer $HOSTINGER_API_KEY" "$URL" || echo '[]')
            NEW=$(echo "$RESPONSE" | jq --arg previous "$PREVIOUS_IDS" '
              ($previous | split(",") | map(select(length > 0))) as $old |
              [.[] | select(.id as $id | ($old | index($id) | not))]
            ')
            echo "$RESPONSE" | jq -r '[.[] | "\(.name): state=\(.state), health=\(.health // "n/a")"] | join(" | ")'

            FAILED=$(echo "$NEW" | jq '[.[] | select(.state == "exited" or .state == "dead" or .health == "unhealthy")] | length')
            if [ "$FAILED" -gt 0 ]; then
              echo "$NEW" | jq .
              curl --silent --show-error                 -H "Authorization: Bearer $HOSTINGER_API_KEY"                 "https://developers.hostinger.com/api/vps/v1/virtual-machines/1058562/docker/3d-modeling-ai/logs" || true
              exit 1
            fi

            if echo "$NEW" | jq -e '
              length >= 2 and
              all(.[]; .state == "running" and (.health == null or .health == "" or .health == "healthy"))
            ' >/dev/null; then
              echo "3d-modeling-ai is running on a new container generation."
              exit 0
            fi
            sleep 10
          done

          echo "Timed out waiting for healthy containers." >&2
          curl --silent --show-error             -H "Authorization: Bearer $HOSTINGER_API_KEY"             "https://developers.hostinger.com/api/vps/v1/virtual-machines/1058562/docker/3d-modeling-ai/logs" || true
          exit 1

      - name: Verify public API and Blender MCP
        if: steps.secrets.outputs.ready == 'true'
        env:
          THREED_API_TOKEN: ${{ secrets.THREED_API_TOKEN }}
          THREED_HOSTNAME: ${{ vars.THREED_HOSTNAME || '3d-modeling-ai.srv1058562.hstgr.cloud' }}
        run: |
          set -euo pipefail
          BASE_URL="https://$THREED_HOSTNAME"

          for attempt in $(seq 1 36); do
            if HEALTH=$(curl --fail --silent --show-error "$BASE_URL/health"); then
              echo "$HEALTH" | jq .
              if echo "$HEALTH" | jq -e '.ok == true' >/dev/null; then
                break
              fi
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "Public API did not become healthy." >&2
              exit 1
            fi
            sleep 10
          done

          JOB_JSON=$(curl --fail --silent --show-error             -H "Authorization: Bearer $THREED_API_TOKEN"             -H "Content-Type: application/json"             -d '{"prompt":"Deployment MCP smoke test cube","intended_use":"rendering"}'             "$BASE_URL/v1/jobs")
          JOB_ID=$(echo "$JOB_JSON" | jq -r '.job_id')
          test -n "$JOB_ID"
          test "$JOB_ID" != "null"

          SMOKE=$(curl --fail --silent --show-error             -H "Authorization: Bearer $THREED_API_TOKEN"             -X POST             "$BASE_URL/v1/jobs/$JOB_ID/smoke-test")
          echo "$SMOKE" | jq .
          echo "$SMOKE" | jq -e '.status.stage == "mcp_smoke_test_complete"' >/dev/null

          curl --fail --silent --show-error             -H "Authorization: Bearer $THREED_API_TOKEN"             "$BASE_URL/v1/jobs/$JOB_ID/artifacts/renders/smoke-test.png"             -o /tmp/smoke-test.png

          test "$(xxd -p -l 8 /tmp/smoke-test.png)" = "89504e470d0a1a0a"
          echo "Verified API -> Blender worker -> MCP -> headless Blender -> PNG render."
